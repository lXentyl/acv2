version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: acv2-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: acv2print
      POSTGRES_USER: acv2admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acv2admin -d acv2print']
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acv2-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: acv2admin
      DB_PASSWORD: ${DB_PASSWORD:-secure_password}
      DB_NAME: acv2print
      JWT_SECRET: ${JWT_SECRET:-acv2-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-acv2-refresh-secret-change}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - '3000:3000'

  # React Frontend (dev mode)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acv2-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3000/api

volumes:
  pgdata:
